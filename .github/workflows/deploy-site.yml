name: Deploy production site

on:
  push:
    branches: [main]
    paths:
      - new-work-site/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer content publish supersedes an older site build. Studio deployment has
# a separate concurrency group, so a content publish can never cancel it.
concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build from Sanity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: new-work-site
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: new-work-site/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and Astro templates
        run: pnpm typecheck

      - name: Check source quality
        run: pnpm lint

      - name: Run coverage gates for code pushes
        if: github.event_name == 'push'
        run: pnpm test:coverage

      - name: Build published Sanity content for verification
        run: pnpm build
        env:
          PUBLIC_CONTENT_MODE: production
          PUBLIC_SANITY_PROJECT_ID: 7un4plyu
          PUBLIC_SANITY_DATASET: production
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /

      - name: Verify static output
        run: pnpm verify:dist

      - name: Install the production smoke-test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the published CMS graph on desktop and mobile
        run: >-
          PLAYWRIGHT_PREVIEW_SERVER=1 pnpm exec playwright test
          tests/e2e/cms-production.spec.ts
          --project=desktop-chromium
          --project=mobile-chromium
          --workers=1
        env:
          PLAYWRIGHT_CONTENT_MODE: production
          PUBLIC_CONTENT_MODE: production
          PUBLIC_SANITY_PROJECT_ID: 7un4plyu
          PUBLIC_SANITY_DATASET: production
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /

      - name: Build the repository-path Pages artifact
        run: pnpm exec astro build
        env:
          PUBLIC_CONTENT_MODE: production
          PUBLIC_SANITY_PROJECT_ID: 7un4plyu
          PUBLIC_SANITY_DATASET: production
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify repository-path output
        run: pnpm verify:dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: new-work-site/dist

  deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5
