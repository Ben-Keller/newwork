name: Deploy versioned site

on:
  push:
    branches: [main]
    paths:
      - new-work-site/**
      - hosting/**
      - versions/v1/**
      - studio-new-work/schemaTypes/**
      - studio-new-work/shared/**
      - studio-new-work/sanity.constants.ts
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer Pages build supersedes an older one. Studio deployment has its own
# concurrency group and is never cancelled by a site build.
concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build V1 and V2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAGES_SITE_URL: https://${{ github.repository_owner }}.github.io
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    defaults:
      run:
        working-directory: new-work-site
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: new-work-site/pnpm-lock.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and Astro templates
        run: pnpm typecheck

      - name: Check source quality
        run: pnpm lint

      - name: Run coverage gates for code pushes
        if: github.event_name == 'push'
        run: pnpm test:coverage

      - name: Test Pages packaging and version isolation
        run: node --test ../hosting/hosting.test.mjs

      - name: Build the isolated versions and root redirect
        run: node ../hosting/build.mjs

      - name: Verify every versioned route and local asset
        run: node ../hosting/verify.mjs

      - name: Install the Pages smoke-test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify both versions on their actual Pages paths
        run: >-
          pnpm exec playwright test --config playwright.pages.config.ts
          --project=desktop-chromium
          --project=mobile-chromium
          --workers=2

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    name: Publish GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v5
