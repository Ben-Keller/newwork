name: Deploy Sanity Studio

on:
  push:
    branches: [main]
    paths:
      - studio-new-work/**
      - new-work-oliver-review/sanity/**
      - .github/workflows/deploy-studio.yml
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight Studio/schema upload. Later pushes wait their turn.
concurrency:
  group: sanity-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate schema and deploy Studio
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-new-work/package-lock.json

      - name: Install Studio dependencies
        working-directory: studio-new-work
        run: npm ci

      # Studio's maintenance entry points import the active website's typed
      # gallery tools. Install that workspace as well on a clean CI checkout.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - name: Install active website dependencies
        working-directory: new-work-oliver-review
        run: pnpm install --frozen-lockfile

      - name: Validate, type-check, and build Studio
        working-directory: studio-new-work
        run: npm run deploy:check

      - name: Require generated schema and query types to be committed
        run: >-
          git diff --exit-code --
          studio-new-work/schema.json
          new-work-oliver-review/src/sanity.types.ts

      - name: Deploy Studio and require schema upload
        working-directory: studio-new-work
        run: npm run deploy:ci
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
